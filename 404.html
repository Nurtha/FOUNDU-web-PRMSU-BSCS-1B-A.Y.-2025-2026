<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 | Not found</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0e14;
    color: #c9d1d9;
    font-family: "SF Mono", "Fira Code", Consolas, monospace;
    background-image:
      linear-gradient(rgba(0,255,170,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,170,.04) 1px, transparent 1px);
    background-size: 40px 40px;
    padding: 24px;
  }
  .card {
    text-align: center;
    max-width: 520px;
    padding: 48px 36px;
    border: 1px solid rgba(0,255,170,.25);
    border-radius: 14px;
    background: rgba(13,17,23,.85);
    box-shadow: 0 0 40px rgba(0,255,170,.08);
  }
  h1 {
    font-size: clamp(72px, 18vw, 120px);
    line-height: 1;
    color: #00ffaa;
    text-shadow: 0 0 24px rgba(0,255,170,.5);
    letter-spacing: 4px;
  }
  p { margin-top: 18px; font-size: 18px; }
  .sub { margin-top: 8px; font-size: 14px; color: #6e7681; }
  a {
    display: inline-block;
    margin-top: 32px;
    padding: 12px 26px;
    color: #00ffaa;
    text-decoration: none;
    border: 1px solid #00ffaa;
    border-radius: 8px;
    transition: background .2s, color .2s, box-shadow .2s;
  }
  a:hover {
    background: #00ffaa;
    color: #0a0e14;
    box-shadow: 0 0 20px rgba(0,255,170,.5);
  }
  .cursor { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
  <div class="card">
    <h1>404</h1>
    <p>You're not supposed to be here<span class="cursor">_</span></p>
    <div class="sub">Nothing to see. Move along.</div>
    <a href="https://github.com/Nurtha" target="_blank" rel="noopener noreferrer">Visit my GitHub</a>
  </div>
</body>
</html>
