<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FoundU Login</title>
  <link rel="stylesheet" href="Login.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body  oncontextmenu="return false;">
  <div class="bg-orb orb-one" aria-hidden="true"></div>
  <div class="bg-orb orb-two" aria-hidden="true"></div>
  <div class="bg-orb orb-three" aria-hidden="true"></div>

  <main class="login-shell">
    <article class="login-panel">
      <div class="logo-section">
        <div class="logo-badge">
          <i class="fas fa-hand-holding-heart"></i>
        </div>
        <h1>FoundU</h1>
        <p class="tagline">Admin Portal</p>
      </div>

      <section class="form-section">
        <h2>Secure Login</h2>
        <p class="form-subtitle">Sign in with Google. Admin access is only granted to allowed accounts.</p>

        <div id="googleSignIn" class="login-form" style="display:flex;justify-content:center;"></div>
        <button id="goAdminBtn" type="button" class="login-btn" style="display:none;margin-top:14px;">
          <span>Open Admin Panel</span>
          <i class="fas fa-arrow-right"></i>
        </button>

        <p id="errorMsg" class="error-msg"></p>
      </section>
    </article>
  </main>

  <script src="security-shortcuts.js"></script>
  <script src="Login.js"></script>
</body>
</html>
